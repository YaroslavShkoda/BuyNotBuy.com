services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: buynotbuy
      POSTGRES_PASSWORD: buynotbuy
      POSTGRES_DB: buynotbuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-dev-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buynotbuy -d buynotbuy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
